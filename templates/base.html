<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Skillia{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#702ae1',
                        secondary: '#702ae1',
                        accent: '#b80438',
                        background: '#f5f7f9',
                        surface: '#ffffff',
                        text: '#2c2f31',
                        'text-secondary': '#595c5e',
                        'text-muted': '#6b7280',
                        'btn-primary': '#702ae1',
                        'btn-primary-text': '#ffffff',
                        'btn-secondary': '#eef2ff',
                        'btn-secondary-text': '#702ae1',
                    },
                    fontFamily: {
                        headline: ['Manrope', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Modales del footer: el <dialog> nativo se centra solo con margin auto. */
        dialog.modal-panel {
            margin: auto;
            width: calc(100% - 2rem);
            max-width: 42rem;
            border: 0;
            border-radius: 1rem;
            background-color: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .35);
            padding: 0;
        }

        dialog.modal-panel::backdrop {
            background-color: rgba(15, 23, 42, .55);
        }

        dialog.modal-panel[open] {
            animation: modal-in .18s ease-out;
        }

        /* Evita el scroll de fondo mientras hay un modal abierto. */
        body:has(dialog.modal-panel[open]) {
            overflow: hidden;
        }

        @keyframes modal-in {
            from { opacity: 0; transform: translateY(.75rem) scale(.98); }
            to   { opacity: 1; transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            dialog.modal-panel[open] { animation: none; }
        }
    </style>
</head>
<body class="font-body">
    {% block content %}{% endblock %}

    {% include "partials/footer.html" %}

    <script>
    document.addEventListener("click", function (event) {
        const opener = event.target.closest("[data-modal-open]");
        if (opener) {
            // Si el menú móvil está desplegado, ciérralo para que no quede detrás del modal.
            const mobileMenu = document.getElementById("mobile-menu-toggle");
            if (mobileMenu) mobileMenu.checked = false;

            const dialog = document.getElementById(opener.dataset.modalOpen);
            if (dialog) dialog.showModal();
            return;
        }

        const closer = event.target.closest("[data-modal-close]");
        if (closer) {
            closer.closest("dialog").close();
        }
    });

    // Cerrar al hacer click fuera del panel (el click cae sobre el propio <dialog>).
    document.querySelectorAll("dialog.modal-panel").forEach(function (dialog) {
        dialog.addEventListener("click", function (event) {
            if (event.target === dialog) dialog.close();
        });
    });
    </script>
</body>
</html>
