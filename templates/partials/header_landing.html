{% load static %}

<header class="w-full">
    <input type="checkbox" id="mobile-menu-toggle" class="hidden peer" />
    <div class="flex justify-between items-center px-4 py-3 md:px-8">
        <p class="text-secondary font-semibold text-2xl">Skillia</p>

        <div class="hidden md:flex gap-12">
            <a href="/" class="text-text-muted font-semibold font-headline">Inicio</a>
            <a href="/courses/" class="text-text-muted font-semibold font-headline">Cursos</a>
        </div>

        {% if request.user.is_authenticated %}
        <div class="hidden md:flex gap-6 items-center">
            <a href="{% url 'dashboard' %}" class="text-secondary font-semibold font-headline">Dashboard</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="flex gap-1 items-center text-red-500 font-bold hover:cursor-pointer hover:text-red-700">
                    <span class="inline-block w-4 h-4 [mask-image:url('{% static "icons/log-out.svg" %}')] [mask-size:contain] [mask-repeat:no-repeat] bg-red-500"></span>
                    Cerrar sesión
                </button>
            </form>
        </div>
        {% else %}
        <div class="hidden md:flex gap-6 items-center">
            <a href="{% url 'login' %}" class="text-secondary font-semibold font-headline">Iniciar Sesión</a>
            <a href="{% url 'signup' %}" class="bg-btn-primary px-6 py-2 rounded-lg text-btn-primary-text font-semibold font-headline">Registrarse</a>
        </div>
        {% endif %}

        <label for="mobile-menu-toggle" class="md:hidden text-secondary text-2xl cursor-pointer">☰</label>
    </div>

    <div class="hidden peer-checked:flex flex-col gap-4 px-4 pb-4 md:hidden">
        <a href="/" class="text-text-muted font-semibold">Inicio</a>
        <a href="/courses/" class="text-text-muted font-semibold">Cursos</a>
        {% if request.user.is_authenticated %}
        <a href="{% url 'dashboard' %}" class="text-secondary font-semibold">Dashboard</a>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="flex gap-1 items-center text-red-500 font-bold text-left">
                <span class="inline-block w-4 h-4 [mask-image:url('{% static "icons/log-out.svg" %}')] [mask-size:contain] [mask-repeat:no-repeat] bg-red-500"></span>
                Cerrar sesión
            </button>
        </form>
        {% else %}
        <a href="{% url 'login' %}" class="text-secondary font-semibold">Iniciar Sesión</a>
        <a href="{% url 'signup' %}" class="bg-btn-primary px-4 py-2 rounded-lg text-btn-primary-text font-semibold text-center">Registrarse</a>
        {% endif %}
    </div>
</header>
